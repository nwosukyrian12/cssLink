    <title>Document</title>
    <style>
      a:link{
        color: rgb(222, 162, 162);
        background-color: #1ebba3;
        display: inline-block;
        padding: 10px 20px;
        border: 10px solid #099983;
        text-decoration: none;
        border-bottom: 1px solid greenyellow;
        text-align: center;
        font: 14px Arial, sans-serif;
        border-radius: 10px;
      }
       a:visited {
        color: rgb(206, 36, 36);
        background-color: #1ebba3;
        display: inline-block;
        padding: 10px 20px;
        border: 10px solid #099983;
        text-decoration: none;
        border-bottom: 2px solid #9c6ae1;
        text-align: center;
        font: 14px Arial, sans-serif;
        border-radius: 10px;
      }
      a:hover, a:active{
        background-color: #9c6ae1;
        border-color: #f1efbe;
      }
    </style>
  </head>
