<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #home:link {
        font-size: 25px;
        color: #4a33cfbf;
        text-decoration: none;
        border-bottom: 1px solid;
        font-family: fantasy;
      }

      #home:visited{
        font-size: 4px;
        color: #ea0e3dbf;
        text-decoration: none;
        border-bottom: 1px solid;
        font-family: cursive;
      }
      #home:hover{
        font-size: 45px;
        color: #eabe0ebf;
        border-bottom: 1px solid;
        font-family:'Times New Roman', Times, serif;
        border: 5px solid green;
      }

      #home:active{
       
        color: #111110bf;
        border-bottom: 1px solid;
       
      }

      #about:link {
        font-size: 25px;
        color: #3d356dbf;
        text-decoration: none;
        border-bottom: 1px solid;
        font-family: fantasy;
      }

      #about:visited{
        font-size: 4px;
        color: #22542ebf;
        text-decoration: none;
        border-bottom: 1px solid;
        font-family: cursive;
      }
      #about:hover{
        font-size: 45px;
        color: #eabe0ebf;
        border-bottom: 1px solid;
        font-family:'Times New Roman', Times, serif;
        border: 5px solid green;
      }
      #about:active{
        color: #111110bf;
        border-bottom: 1px solid;
       
      }


    </style>
  </head>
  <body>
        <a id="home" href="https://www.google.com">Google</a>
         <a id="about" href="#">About</a>

    
  </body>
</html>
